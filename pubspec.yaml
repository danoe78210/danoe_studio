name: danoestudio
description: "Danoë Studio — Machine à romans pour écrivains indépendants."
publish_to: 'none'

version: 3.5.0+35

environment:
  sdk: '>=3.0.0 <4.0.0'

# ─────────────────────────────────────────────────────────────
#  DÉPENDANCES
# ─────────────────────────────────────────────────────────────
dependencies:
  flutter:
    sdk: flutter

  # Polices Google (Cinzel, Crimson Text, Cormorant…)
  google_fonts: ^8.2.1

  # Génération du QR Code (page Contact)
  qr_flutter: ^4.1.0

  # Appels HTTP (correcteur LanguageTool, services)
  http: ^1.2.0

  # Manipulation de chemins de fichiers
  path: ^1.9.0

# ─────────────────────────────────────────────────────────────
#  DÉPENDANCES DE DÉVELOPPEMENT
# ─────────────────────────────────────────────────────────────
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Génération automatique de l'icône (exe / fenêtre)
  flutter_launcher_icons: ^0.14.4

# ─────────────────────────────────────────────────────────────
#  CONFIGURATION FLUTTER
# ─────────────────────────────────────────────────────────────
flutter:
  uses-material-design: true

  assets:
    - assets/icon/

# ─────────────────────────────────────────────────────────────
#  GÉNÉRATION DE L'ICÔNE (plume dorée)
# ─────────────────────────────────────────────────────────────
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256
